name: Actualisation quotidienne des dates historiques
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester la synchronisation et la vérification
        run: node --test tests/history.test.mjs
      - name: Récupérer les événements et vérifier les dates
        run: npm run sync:history
      - name: Enregistrer les données validées
        run: |
          git add data/day-in-history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualise les événements et les dates historiques'
          git push origin HEAD:${{ github.event.repository.default_branch }}
